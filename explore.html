<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0757A0"><title>Explore - Ride Chalo</title><link rel="stylesheet" href="./styles.css"></head>
<body><div class="app">
<header class="header"><div class="header-row"><div><h2>🌴 Explore</h2><small>Discover places around you</small></div><button class="iconbtn" onclick="history.back()">←</button></div></header>
<main class="main"><div class="card"><label class="label">Your Location</label><input class="input" id="place" placeholder="Enter city or place"></div>
<section class="section"><div class="section-title">Popular Categories</div><div class="grid2">
<div class="action"><span style="font-size:28px">🏞️</span><b>Tourist Places</b><small>Places to visit</small></div>
<div class="action"><span style="font-size:28px">🍽️</span><b>Food</b><small>Nearby restaurants</small></div>
<div class="action"><span style="font-size:28px">🏨</span><b>Hotels</b><small>Stay nearby</small></div>
<div class="action"><span style="font-size:28px">🛍️</span><b>Shopping</b><small>Markets and malls</small></div>
</div></section>
<div class="notice">Automatic location-based places can be connected with Maps/API in the next backend integration.</div>
</main></div></body></html>
