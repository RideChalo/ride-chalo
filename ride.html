<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0757A0"><title>Book a Ride - Ride Chalo</title><link rel="stylesheet" href="./styles.css"></head>
<body><div class="app">
<header class="header"><div class="header-row"><div><h2>🚕 Book a Ride</h2><small>Choose pickup and destination</small></div><button class="iconbtn" onclick="history.back()">←</button></div></header>
<main class="main">
<div class="card">
<div class="form-row"><label class="label">Pickup Location</label><input class="input" id="pickup" placeholder="Enter pickup location"></div>
<div class="form-row"><label class="label">Destination</label><input class="input" id="destination" placeholder="Where to?"></div>
<div class="form-row"><label class="label">Ride Type</label><select class="select" id="type"><option>Bike</option><option>Auto</option><option>Cab</option></select></div>
<button class="btn" onclick="book()">Find Ride</button><div id="msg" class="notice hidden"></div>
</div>
<div class="section"><div class="section-title">Safety</div><div class="card">🛡️ Share your ride details with a trusted contact after booking.</div></div>
</main>
</div>
<script>
function book(){let p=pickup.value.trim(),d=destination.value.trim();if(!p||!d){msg('Please enter pickup and destination.');return}localStorage.setItem('rc_last_ride',JSON.stringify({pickup:p,destination:d,type:type.value,status:'Searching'}));msg('Ride request created. Driver matching will be connected in the next backend step.',true)}
function msg(t,ok=false){const e=document.getElementById('msg');e.textContent=t;e.className='notice '+(ok?'success':'error')}
</script></body></html>
