<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0757A0"><title>Rental - Ride Chalo</title><link rel="stylesheet" href="./styles.css"></head>
<body><div class="app">
<header class="header"><div class="header-row"><div><h2>🏍️ Vehicle Rental</h2><small>Rent a bike or car</small></div><button class="iconbtn" onclick="history.back()">←</button></div></header>
<main class="main">
<div class="grid2">
<div class="action" onclick="choose('Bike')"><span style="font-size:30px">🏍️</span><b>Bike</b><small>Hourly / daily rental</small></div>
<div class="action" onclick="choose('Car')"><span style="font-size:30px">🚗</span><b>Car</b><small>Hourly / daily rental</small></div>
</div>
<div class="card" style="margin-top:14px">
<div class="form-row"><label class="label">Pickup Location</label><input class="input" id="loc" placeholder="Enter location"></div>
<div class="form-row"><label class="label">Rental Duration</label><select class="select" id="duration"><option>1 Hour</option><option>4 Hours</option><option>1 Day</option><option>3 Days</option></select></div>
<button class="btn" onclick="search()">Find Vehicles</button><div id="msg" class="notice hidden"></div>
</div>
</main></div>
<script>
let vehicle='Bike';function choose(v){vehicle=v;msg(v+' selected.',true)}
function search(){if(!loc.value.trim()){msg('Please enter pickup location.');return}msg(vehicle+' rental search created for '+duration.value+'. Vehicle-owner matching will be connected in the backend step.',true)}
function msg(t,ok=false){const e=document.getElementById('msg');e.textContent=t;e.className='notice '+(ok?'success':'error')}
</script></body></html>
