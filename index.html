<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0757A0">
  <title>Ride Chalo</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f4f8fc;
      color: #10243e;
      min-height: 100vh;
    }

    .app {
      max-width: 480px;
      min-height: 100vh;
      margin: auto;
      background: white;
      display: flex;
      flex-direction: column;
    }

    .top {
      background: linear-gradient(135deg, #064f91, #0877c9);
      color: white;
      padding: 55px 25px 45px;
      text-align: center;
      border-radius: 0 0 30px 30px;
    }

    .logo {
      width: 72px;
      height: 72px;
      margin: auto;
      border-radius: 22px;
      background: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 38px;
      box-shadow: 0 8px 25px rgba(0,0,0,.15);
    }

    .brand {
      font-size: 34px;
      font-weight: 800;
      margin-top: 15px;
    }

    .brand span {
      color: #35df91;
    }

    .tagline {
      margin-top: 8px;
      font-size: 14px;
      opacity: .95;
    }

    .content {
      padding: 30px 22px;
      flex: 1;
    }

    .welcome {
      font-size: 25px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #68788c;
      font-size: 14px;
      line-height: 1.5;
      margin-bottom: 25px;
    }

    .input-label {
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 8px;
      display: block;
    }

    .phone-box {
      display: flex;
      border: 1px solid #d7e0ea;
      border-radius: 14px;
      overflow: hidden;
      height: 54px;
      background: white;
    }

    .country {
      width: 70px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-right: 1px solid #d7e0ea;
      font-weight: 600;
      color: #31465e;
    }

    .phone-box input {
      flex: 1;
      border: none;
      outline: none;
      padding: 0 15px;
      font-size: 16px;
    }

    .continue {
      width: 100%;
      height: 54px;
      border: none;
      border-radius: 14px;
      margin-top: 20px;
      background: linear-gradient(135deg, #0877c9, #0757a0);
      color: white;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 7px 18px rgba(7,87,160,.22);
    }

    .continue:active {
      transform: scale(.98);
    }

    .features {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-top: 30px;
    }

    .feature {
      background: #f4f8fc;
      border-radius: 15px;
      padding: 15px 6px;
      text-align: center;
      font-size: 12px;
      color: #40556d;
    }

    .feature-icon {
      font-size: 25px;
      margin-bottom: 7px;
    }

    .bottom {
      text-align: center;
      padding: 20px;
      color: #8492a3;
      font-size: 11px;
    }

    .privacy {
      margin-top: 8px;
      color: #0877c9;
    }
  </style>
</head>

<body>

  <div class="app">

    <div class="top">
      <div class="logo">📍</div>

      <div class="brand">
        Ride <span>Chalo</span>
      </div>

      <div class="tagline">
        RIDE • RENT • EXPLORE
      </div>
    </div>

    <div class="content">

      <div class="welcome">
        Welcome to Ride Chalo 👋
      </div>

      <div class="subtitle">
        Book rides, rent vehicles and explore places —
        all in one platform.
      </div>

      <label class="input-label">
        Mobile Number
      </label>

      <div class="phone-box">
        <div class="country">🇮🇳 +91</div>

        <input
          id="phone"
          type="tel"
          inputmode="numeric"
          maxlength="10"
          placeholder="Enter mobile number"
        >
      </div>

      <button class="continue" onclick="continueLogin()">
        Continue
      </button>

      <div class="features">

        <div class="feature">
          <div class="feature-icon">🚕</div>
          Ride
        </div>

        <div class="feature">
          <div class="feature-icon">🏍️</div>
          Rental
        </div>

        <div class="feature">
          <div class="feature-icon">🌴</div>
          Explore
        </div>

      </div>

    </div>

    <div class="bottom">
      By continuing, you agree to our Terms & Privacy Policy.
      <div class="privacy">
        Ride Chalo
      </div>
    </div>

  </div>

      const phone = document.getElementById("phone").value.trim();

      if (phone.length !== 10 || !/^[0-9]+$/.test(phone)) {
        alert("Please enter a valid 10-digit mobile number.");
