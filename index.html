<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0757A0"><link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icon-192.png"><title>Ride Chalo</title>
<link rel="stylesheet" href="./styles.css">
</head>
<body>
<div class="app">
  <div class="top">
    <div class="logo"><img src="./ride-chalo-logo.png" alt="Ride Chalo"></div>
    <div class="brand">Ride <span>Chalo</span></div>
    <div class="tagline">RIDE • RENT • EXPLORE</div>
  </div>
  <div class="content">
    <div class="welcome">Welcome to Ride Chalo 👋</div>
    <div class="subtitle">Book rides, rent vehicles and explore places — all in one platform.</div>
    <label class="label">Mobile Number</label>
    <div class="phone-box">
      <div class="country">🇮🇳 +91</div>
      <input id="phone" type="tel" inputmode="numeric" maxlength="10" placeholder="Enter mobile number">
    </div>
    <button class="btn" style="margin-top:20px" onclick="continueLogin()">Continue</button>
    <div id="msg" class="notice hidden"></div>
    <div class="features">
      <div class="feature"><div class="feature-icon">🚕</div>Ride</div>
      <div class="feature"><div class="feature-icon">🏍️</div>Rental</div>
      <div class="feature"><div class="feature-icon">🌴</div>Explore</div>
    </div>
  </div>
  <div class="bottom">By continuing, you agree to our Terms & Privacy Policy.<div>Ride Chalo</div></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./supabase-config.js"></script>
<script>
function showMsg(t,ok=false){const e=document.getElementById('msg');e.textContent=t;e.className='notice '+(ok?'success':'');}
async function continueLogin(){
 const p=document.getElementById('phone').value.trim();
 if(!/^[6-9][0-9]{9}$/.test(p)){showMsg('Please enter a valid 10-digit Indian mobile number.');return;}
 const phone='+91'+p;
 localStorage.setItem('rc_pending_phone',phone);
 if(!supabaseReady()){
   location.href='otp.html?demo=1'; return;
 }
 const {error}=await supabaseClient.auth.signInWithOtp({phone});
 if(error){showMsg(error.message);return;}
 location.href='otp.html';
}
</script>
</body></html>
